services:
  creator-toolkit:
    image: creator-toolkit:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      CREATOR_TOOLKIT_DataDirectory: /app/data
      CREATOR_TOOLKIT_PublicUrl: "${CREATOR_TOOLKIT_PUBLIC_URL:-}"
      CREATOR_TOOLKIT_TrustedNetworks: "${CREATOR_TOOLKIT_TRUSTED_NETWORKS:-}"
      CREATOR_TOOLKIT_TrustedProxies: "${CREATOR_TOOLKIT_TRUSTED_PROXIES:-}"
    ports:
      - "${CREATOR_TOOLKIT_HOST_BIND:-127.0.0.1}:${CREATOR_TOOLKIT_HOST_PORT:-8080}:8080"
    volumes:
      - creator-toolkit-data:/app/data
    healthcheck:
      test: ["CMD", "creator-toolkit", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  creator-toolkit-data:
